<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PESKY RECHARGE - Buy Data</title>
  <link rel="stylesheet" href="css/data.css">
</head>
<body>
  <main class="data-shell">
    <section class="data-card">
      <a class="back-link" href="dashboard.html">← Back to dashboard</a>

      <header class="page-heading">
        <div>
          <p class="eyebrow">PESKY RECHARGE</p>
          <h1>Buy Data</h1>
          <p class="subheading">Choose a bundle and send it instantly to any Nigerian number.</p>
        </div>
        <div class="balance-pill">Balance <strong id="balance">₦0.00</strong></div>
      </header>

      <form id="dataForm" novalidate>
        <!-- Phone -->
        <label class="field-label" for="phone">Phone number</label>
        <div class="phone-field">
          <span class="country-code">+234</span>
          <input id="phone" name="phone" type="tel" placeholder="801 107 84273" maxlength="13" required>
        </div>
        <p id="phoneHint" class="field-hint">Enter an 11-digit Nigerian number.</p>

        <!-- Network -->
        <div class="network-heading">
          <span class="field-label">Network</span>
          <span id="detectedNetwork" class="detected-network">Waiting for number</span>
        </div>
        <div class="network-grid" role="radiogroup" aria-label="Select network">
          <label class="network-option"><input type="radio" name="network" value="MTN"><span>MTN</span></label>
          <label class="network-option"><input type="radio" name="network" value="GLO"><span>Glo</span></label>
          <label class="network-option"><input type="radio" name="network" value="AIRTEL"><span>Airtel</span></label>
          <label class="network-option"><input type="radio" name="network" value="9MOBILE"><span>9mobile</span></label>
        </div>

        <!-- Bundles -->
        <section id="bundleSection" class="bundle-section" aria-labelledby="bundleLabel">
          <div class="bundle-heading">
            <span id="bundleLabel" class="field-label">Choose a data bundle</span>
            <span id="planCount" class="plan-count"></span>
          </div>
          <label class="plan-search-label" for="planSearch">Search plans</label>
          <input id="planSearch" class="plan-search" type="search" placeholder="Search by size, type or validity" autocomplete="off">
          <div id="bundleGrid" class="bundle-grid"></div>
        </section>

        <!-- Error + Button -->
        <p id="message" class="message" role="status" aria-live="polite"></p>
        <button id="buyDataBtn" type="submit" class="buy-button">Buy data</button>
      </form>

      <!-- Success -->
      <div id="successPanel" class="success-panel hidden">
        <div class="success-icon">&#10003;</div>
        <p class="success-label">Transaction complete</p>
        <h2>Data purchase successful</h2>
        <p id="successDetails"></p>
        <button id="successOkButton" class="success-ok" type="button">OK</button>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="javascript/data.js"></script>
</body>
</html>
