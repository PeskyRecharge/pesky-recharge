<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - PESKY RECHARGE</title>
  <link rel="stylesheet" href="css/create-account.css">
</head>
<body>
  <div class="container">
    <h1 class="title">PESKY RECHARGE</h1>

    <!-- Create Account Form -->
    <form id="createForm" class="form">
      <div class="form-group">
        <label>Surname</label>
        <input type="text" id="surname" placeholder="Enter your surname" required>
      </div>

      <div class="form-group">
        <label>Other Name</label>
        <input type="text" id="othername" placeholder="Enter your other name" required>
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="Enter your email" required>
      </div>

      <div class="form-group">
        <label>Phone Number</label>
        <input type="tel" id="phone" placeholder="Enter your phone number" required>
      </div>

      <div class="form-group">
        <label>Gender</label>
        <select id="gender" required>
          <option value="">Select your gender</option>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <button type="submit" class="btn">Create Account</button>
    </form>

    <!-- OTP Section -->
    <div id="otpSection" class="otp-section hidden">
      <p class="message">OTP sent to your email. Enter code below:</p>
      <input type="text" id="code" placeholder="Enter verification code">
      <button id="verifyBtn" class="btn">Verify</button>
    </div>

    <!-- Success Message -->
    <p id="successMessage" class="success hidden">Account created successfully!</p>
  </div>

  <!-- Load Supabase library BEFORE your JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="javascript/create-account.js"></script>
</body>
</html>b
