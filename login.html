<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - PESKY RECHARGE</title>
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <div class="container">
    <h1 class="title">PESKY RECHARGE</h1>

    <form id="loginForm" class="form">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="Enter your email" required>
      </div>
      <button type="submit" class="btn">Login</button>
    </form>

    <!-- OTP Section (hidden initially) -->
    <div id="otpSection" class="otp-section hidden">
      <p class="message">OTP sent to your email. Enter code below:</p>
      <input type="text" id="code" placeholder="Enter verification code">
      <button id="verifyBtn" class="btn">Verify OTP</button>
    </div>

    <!-- Success Message -->
    <p id="successMessage" class="success hidden">Login successful!</p>
  </div>

  <!-- ✅ Load Supabase library first -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- ✅ Then load your login script -->
  <script src="javascript/login.js"></script>
</body>
</html>
