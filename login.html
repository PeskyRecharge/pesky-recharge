<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - PESKY RECHARGE</title>
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <div class="background-decoration"></div>
  
  <div class="login-container">
    <!-- Padlock Icon in Circle -->
    <div class="padlock-circle">
      <span class="padlock-icon">🔒</span>
    </div>

    <h1 class="title">Welcome Back</h1>
    <p class="subtitle">Sign in to your PESKY RECHARGE account</p>

    <form id="loginForm" class="form">
      <div class="form-group">
        <label for="phone">Phone Number</label>
        <div class="input-wrapper">
          <input type="tel" id="phone" placeholder="Enter your phone number" required>
          <span class="input-icon">📱</span>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <input type="password" id="password" placeholder="Enter your password" required>
          <span class="input-icon">🔒</span>
        </div>
      </div>
      <button type="submit" class="btn btn-primary">Sign In</button>
    </form>

    <button type="button" id="forgotPasswordLink" class="forgot-password-link">
      Forgot your password?
    </button>

    <section id="passwordResetSection" class="otp-section hidden" aria-labelledby="resetTitle">
      <h2 id="resetTitle" class="reset-title">Reset your password</h2>
      <p id="resetMessage" class="message">Enter your account email and we will send you a verification code.</p>

      <form id="resetEmailForm" class="form reset-form">
        <div class="form-group">
          <label for="resetEmail">Email address</label>
          <div class="input-wrapper">
            <input type="email" id="resetEmail" placeholder="you@example.com" autocomplete="email" required>
            <span class="input-icon">✉️</span>
          </div>
        </div>
        <button type="submit" class="btn btn-primary">Send verification code</button>
      </form>

      <form id="resetCodeForm" class="form reset-form hidden">
        <div class="form-group">
          <label for="resetCode">Verification code</label>
          <div class="input-wrapper">
            <input type="text" id="resetCode" inputmode="numeric" autocomplete="one-time-code" placeholder="Enter the 6-digit code" maxlength="6" required>
            <span class="input-icon">🔢</span>
          </div>
        </div>
        <button type="submit" class="btn btn-primary">Verify code</button>
      </form>

      <form id="newPasswordForm" class="form reset-form hidden">
        <div class="form-group">
          <label for="newPassword">New password</label>
          <div class="input-wrapper">
            <input type="password" id="newPassword" placeholder="Create a new password" autocomplete="new-password" minlength="6" required>
            <span class="input-icon">🔒</span>
          </div>
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirm new password</label>
          <div class="input-wrapper">
            <input type="password" id="confirmPassword" placeholder="Repeat your new password" autocomplete="new-password" minlength="6" required>
            <span class="input-icon">🔒</span>
          </div>
        </div>
        <button type="submit" class="btn btn-primary">Save new password</button>
      </form>

      <button type="button" id="cancelResetButton" class="reset-cancel">Back to sign in</button>
    </section>

    <!-- Success Message -->
    <p id="successMessage" class="success hidden">✓ Login successful! Redirecting...</p>

    <!-- Footer Link -->
    <div class="footer-link">
      <p>Don't have an account? <a href="create-account.html">Sign up here</a></p>
    </div>
  </div>

  <!-- ✅ Load Supabase library first -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="javascript/notifications.js"></script>
  <!-- ✅ Then load your login script -->
  <script src="javascript/login.js"></script>
</body>
</html>
