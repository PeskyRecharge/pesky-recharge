<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - PESKY RECHARGE</title>
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <div class="background-decoration"></div>
  
  <div class="login-container">
    <!-- Padlock Icon in Circle -->
    <div class="padlock-circle">
      <span class="padlock-icon">🔒</span>
    </div>

    <h1 class="title">Welcome Back</h1>
    <p class="subtitle">Sign in to your PESKY RECHARGE account</p>

    <form id="loginForm" class="form">
      <div class="form-group">
        <label for="phone">Phone Number</label>
        <div class="input-wrapper">
          <input type="tel" id="phone" placeholder="Enter your phone number" required>
          <span class="input-icon">📱</span>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <input type="password" id="password" placeholder="Enter your password" required>
          <span class="input-icon">🔒</span>
        </div>
      </div>
      <button type="submit" class="btn btn-primary">Sign In</button>
    </form>

    <!-- Success Message -->
    <p id="successMessage" class="success hidden">✓ Login successful! Redirecting...</p>

    <!-- Footer Link -->
    <div class="footer-link">
      <p>Don't have an account? <a href="create-account.html">Sign up here</a></p>
    </div>
  </div>

  <!-- ✅ Load Supabase library first -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="javascript/notifications.js"></script>
  <!-- ✅ Then load your login script -->
  <script src="javascript/login.js"></script>
</body>
</html>
